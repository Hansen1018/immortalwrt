name: Build Honk+Doona firmware

on:
  workflow_dispatch:
  push:
    branches:
      - master-Honk+Doona
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: rockchip
  SUBTARGET: armv8
  DEVICE: friendlyarm_nanopi-r5s

jobs:
  build:
    name: Build $TARGET/$SUBTARGET/$DEVICE
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache sources and ccache
        uses: actions/cache@v4
        with:
          path: |
            dl
            ~/.ccache
          key: ${{ runner.os }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ env.DEVICE }}-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ env.DEVICE }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (honk + doona, BTF kernel)
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_rockchip=y
          CONFIG_TARGET_rockchip_armv8=y
          CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r5s=y
          CONFIG_PACKAGE_honk=y
          CONFIG_PACKAGE_luci-app-honk=y
          CONFIG_KERNEL_DEBUG_INFO_BTF=y
          # CONFIG_KERNEL_DEBUG_INFO_REDUCED is not set
          EOF
          make defconfig
          echo '--- resolved selection ---'
          grep -E 'CONFIG_(PACKAGE_(honk|luci-app-honk)|KERNEL_DEBUG_INFO_BTF|DWARVES)=' .config

      - name: Download sources
        run: |
          make download -j$(nproc) V=s || make download -j$(nproc) V=s

      - name: Build
        run: make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ env.DEVICE }}
          path: |
            bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*sysupgrade.img.gz
            bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*.manifest
          if-no-files-found: error
