name: Build Honk+Doona firmware

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'OpenWrt target (e.g. rockchip, x86, qualcommax)'
        required: false
        default: rockchip
      subtarget:
        description: 'OpenWrt subtarget (e.g. armv8, 64, ipq807x)'
        required: false
        default: armv8
      device:
        description: 'Device profile (e.g. friendlyarm_nanopi-r5s, generic)'
        required: false
        default: friendlyarm_nanopi-r5s
  push:
    branches:
      - master-Honk+Doona
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# NOTE: do NOT use bare names like TARGET/SUBTARGET/DEVICE here.
# OpenWrt's build system passes its own TARGET (the board, e.g. "rockchip") into the
# environment of every recipe, and autotools' configure picks up a preset $TARGET:
# libffi would then build in a directory named "rockchip" instead of the target
# triplet and the package would fail to install fficonfig.h.
env:
  OW_TARGET: ${{ github.event.inputs.target || 'rockchip' }}
  OW_SUBTARGET: ${{ github.event.inputs.subtarget || 'armv8' }}
  OW_DEVICE: ${{ github.event.inputs.device || 'friendlyarm_nanopi-r5s' }}

jobs:
  build:
    # NOTE: the "env" context is not available in a job name, only in the steps.
    name: Build ${{ github.event.inputs.target || 'rockchip' }}/${{ github.event.inputs.subtarget || 'armv8' }}/${{ github.event.inputs.device || 'friendlyarm_nanopi-r5s' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cache sources and ccache
        uses: actions/cache@v4
        with:
          path: |
            dl
            ~/.ccache
          key: ${{ runner.os }}-${{ env.OW_TARGET }}-${{ env.OW_SUBTARGET }}-${{ env.OW_DEVICE }}-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.OW_TARGET }}-${{ env.OW_SUBTARGET }}-${{ env.OW_DEVICE }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
            ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (honk + doona, BTF kernel)
        run: |
          cat > .config <<EOF
          CONFIG_TARGET_${OW_TARGET}=y
          CONFIG_TARGET_${OW_TARGET}_${OW_SUBTARGET}=y
          CONFIG_TARGET_${OW_TARGET}_${OW_SUBTARGET}_DEVICE_${OW_DEVICE}=y
          EOF
          cat config/honk-doona.config >> .config
          make defconfig
          echo '--- the resolved selection ---'
          grep -E 'CONFIG_(PACKAGE_(honk|luci-app-honk)|KERNEL_DEBUG_INFO_BTF|DWARVES)=' .config

      - name: Download sources
        run: |
          make download -j$(nproc) V=s || make download -j$(nproc) V=s

      - name: Build
        run: make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ env.OW_TARGET }}-${{ env.OW_SUBTARGET }}-${{ env.OW_DEVICE }}
          path: |
            bin/targets/${{ env.OW_TARGET }}/${{ env.OW_SUBTARGET }}/*sysupgrade.img.gz
            bin/targets/${{ env.OW_TARGET }}/${{ env.OW_SUBTARGET }}/*sysupgrade.bin
            bin/targets/${{ env.OW_TARGET }}/${{ env.OW_SUBTARGET }}/*.manifest
          if-no-files-found: error
